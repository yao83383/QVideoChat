services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports:
      - "4001:3002"
    volumes:
      - server_data:/app/data
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
      args:
        NEXT_PUBLIC_SERVER_URL: https://justsaysayforfun.com
        NEXT_PUBLIC_SOCKET_PATH: /qsignal-video/socket.io
        NEXT_PUBLIC_BASE_PATH: /qvideochat
    ports:
      - "4000:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server_data:
